name: fluenta-production

x-logging: &bounded-json-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-common-security: &common-security
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 384m
    logging: *bounded-json-logging
    <<: *common-security

  migrations:
    image: ${MIGRATIONS_IMAGE:?MIGRATIONS_IMAGE must be an immutable digest reference}
    profiles: ["tools"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    environment:
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: /tmp/bundle
      FLUENTA_POSTGRES: Host=postgres;Port=5432;Database=${POSTGRES_DB:?POSTGRES_DB is required};Username=${POSTGRES_USER:?POSTGRES_USER is required};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required};SSL Mode=Disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    mem_limit: 256m
    logging: *bounded-json-logging
    <<: *common-security

  api:
    image: ${API_IMAGE:?API_IMAGE must be an immutable digest reference}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:?POSTGRES_DB is required};Username=${POSTGRES_USER:?POSTGRES_USER is required};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required};SSL Mode=Disable
      Database__Postgres__ApplicationName: FluentA.Api.Production
      Database__Postgres__MinPoolSize: "0"
      Database__Postgres__MaxPoolSize: "15"
      Database__Postgres__ConnectionTimeoutSeconds: "15"
      Database__Postgres__CommandTimeoutSeconds: "30"
      Hangfire__WorkerCount: "2"
      AssetStorage__Enabled: "true"
      AssetStorage__Provider: S3
      AssetStorage__Bucket: ${S3_BUCKET:?S3_BUCKET is required}
      AssetStorage__Region: ${AWS_REGION:-ap-southeast-1}
      AssetStorage__UsePathStyle: "false"
      Frontend__BaseUrl: ${FRONTEND_BASE_URL:?FRONTEND_BASE_URL is required}
      Frontend__Origins__0: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is required}
      ForwardedHeaders__KnownProxies__0: 172.30.0.2
      Jwt__Key: ${JWT_KEY:?JWT_KEY is required}
      Jwt__Issuer: ${JWT_ISSUER:-FluentA}
      Jwt__Audience: ${JWT_AUDIENCE:-FluentA.Web}
      Authentication__OtpHashKey: ${OTP_HASH_KEY:?OTP_HASH_KEY is required}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      Resend__ApiKey: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      Resend__From: ${RESEND_FROM:?RESEND_FROM is required}
      AzureSpeech__Enabled: ${AZURE_SPEECH_ENABLED:-false}
      AzureSpeech__Region: ${AZURE_SPEECH_REGION:-}
      AzureSpeech__SubscriptionKey: ${AZURE_SPEECH_SUBSCRIPTION_KEY:-}
      AzureSpeech__TimeoutSeconds: "10"
      AzureSpeech__AccuracyThreshold: "70"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      edge:
        ipv4_address: 172.30.0.3
      data: {}
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080;
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          grep -q '200 OK' <&3
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    logging: *bounded-json-logging
    <<: *common-security

  caddy:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE must be an immutable digest reference}
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?CADDY_ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      edge:
        ipv4_address: 172.30.0.2
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 128m
    logging: *bounded-json-logging
    <<: *common-security

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  data:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
