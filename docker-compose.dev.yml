services:
  postgres:
    image: postgres:16-alpine
    container_name: fluenta-postgres
    environment:
      POSTGRES_DB: fluenta_dev
      POSTGRES_USER: fluenta
      POSTGRES_PASSWORD: fluenta_local_pass
    ports:
      - "5432:5432"
    volumes:
      - fluenta_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluenta -d fluenta_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fluenta-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: fluenta-minio
    environment:
      MINIO_ROOT_USER: fluenta_minio_local
      MINIO_ROOT_PASSWORD: fluenta_minio_local_secret
      MINIO_API_CORS_ALLOW_ORIGIN: http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:4173,http://localhost:4173
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - fluenta_minio_data:/data

  minio-bootstrap:
    image: minio/mc:latest
    container_name: fluenta-minio-bootstrap
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: fluenta_minio_local
      MINIO_ROOT_PASSWORD: fluenta_minio_local_secret
      MINIO_BUCKET: fluenta-assets-dev
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo "Waiting for MinIO..."
          sleep 1
        done
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc anonymous set download "local/$$MINIO_BUCKET"

  worker:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: fluenta-worker
    profiles:
      - worker
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:5001
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=fluenta_dev;Username=fluenta;Password=fluenta_local_pass
      ConnectionStrings__Redis: redis:6379
      Database__Postgres__ApplicationName: FluentA.Worker.Compose
      AssetStorage__Endpoint: http://minio:9000
      AssetStorage__PublicBaseUrl: http://127.0.0.1:9000
    ports:
      - "5001:5001"
    volumes:
      - .:/workspace
    command: dotnet run --project src/backend/FluentA.Worker --no-launch-profile
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5001/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  fluenta_postgres_data:
  fluenta_minio_data:
