services:
  postgres:
    image: postgres:16-alpine
    container_name: fluenta-postgres
    environment:
      POSTGRES_DB: fluenta_dev
      POSTGRES_USER: fluenta
      POSTGRES_PASSWORD: fluenta_dev
    ports:
      - "5432:5432"
    volumes:
      - fluenta_postgres_dev_data:/var/lib/postgresql/data

volumes:
  fluenta_postgres_dev_data:
    name: fluenta-postgres-dev-data
