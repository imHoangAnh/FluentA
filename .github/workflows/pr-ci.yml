name: PR CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: Require dev to main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate pull request branches
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -Eeuo pipefail
          [[ "$HEAD_REF" == "dev" ]]
          [[ "$BASE_REF" == "main" ]]

  backend:
    name: Backend
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the pull request revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Restore backend
        run: dotnet restore src/backend/FluentA.slnx

      - name: Test backend
        run: dotnet test src/backend/FluentA.slnx --configuration Release --no-restore

      - name: Publish API
        run: >-
          dotnet publish src/backend/FluentA.API/FluentA.API.csproj
          --configuration Release
          --no-restore
          --output "${{ runner.temp }}/fluenta-api"

  frontend:
    name: Frontend
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the pull request revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm --prefix src/frontend ci

      - name: Lint frontend
        run: npm --prefix src/frontend run lint

      - name: Test frontend
        run: npm --prefix src/frontend run test:run

      - name: Build frontend
        run: npm --prefix src/frontend run build

  containers:
    name: Production containers
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the pull request revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: src/backend
          target: final
          load: true
          push: false
          tags: fluenta-api:pr-ci
          build-args: VCS_REF=${{ github.sha }}

      - name: Build migration image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: src/backend
          target: migrations
          load: true
          push: false
          tags: fluenta-migrations:pr-ci
          build-args: VCS_REF=${{ github.sha }}

      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: src/frontend
          target: final
          load: true
          push: false
          tags: fluenta-frontend:pr-ci
          build-args: |
            VCS_REF=${{ github.sha }}
            VITE_API_URL=https://api.sophion.io.vn/api/v1
            VITE_GOOGLE_CLIENT_ID=ci-validation.apps.googleusercontent.com

      - name: Verify image revisions and runtime identities
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          for image in fluenta-api:pr-ci fluenta-migrations:pr-ci; do
            image_user="$(docker image inspect "$image" --format '{{.Config.User}}')"
            image_revision="$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
            [[ "$image_user" =~ ^[1-9][0-9]*$ ]]
            [[ "$image_revision" == "$EXPECTED_REVISION" ]]
          done

          frontend_user="$(docker image inspect fluenta-frontend:pr-ci --format '{{.Config.User}}')"
          frontend_revision="$(docker image inspect fluenta-frontend:pr-ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          [[ -z "$frontend_user" ]]
          [[ "$frontend_revision" == "$EXPECTED_REVISION" ]]
          docker run --rm --entrypoint /bin/sh fluenta-frontend:pr-ci \
            -ec 'test -f /srv/index.html'

      - name: Validate production Compose
        run: >-
          docker compose
          --env-file deploy/production/env.example
          --file deploy/production/compose.yml
          config --quiet

  delivery-policy:
    name: Delivery policy
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the pull request revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Reject mutable production images and public data ports
        run: bash deploy/production/bin/validate-delivery-policy.sh

      - name: Test the fixed host release boundary
        run: |
          set -Eeuo pipefail
          for test_script in \
            deploy-release.test.sh \
            install-deployment-artifacts.test.sh; do
            docker run --rm \
              --volume "$PWD:/repo:ro" \
              mcr.microsoft.com/dotnet/sdk:10.0@sha256:72dd743782f2ae7e5476fd64f6a460045e3998dc862218b80e6944cba79a01b0 \
              bash "/repo/deploy/production/tests/${test_script}"
          done
