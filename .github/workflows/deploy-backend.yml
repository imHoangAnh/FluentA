name: Deploy Azure production

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production
    permissions:
      contents: read
      packages: write
    outputs:
      api: ${{ steps.api.outputs.digest }}
      migrations: ${{ steps.migrations.outputs.digest }}
      web: ${{ steps.web.outputs.digest }}
      prefix: ${{ steps.identity.outputs.prefix }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Set release identity and registry login
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: |
          set -Eeuo pipefail
          [[ "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GOOGLE_CLIENT_ID" =~ ^[0-9A-Za-z._-]+\.apps\.googleusercontent\.com$ ]]
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf 'prefix=%s\n' "$prefix" >> "$GITHUB_OUTPUT"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build API
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: src/backend
          target: final
          platforms: linux/amd64
          push: true
          tags: ${{ steps.identity.outputs.prefix }}-api:${{ github.event.pull_request.merge_commit_sha }}
          build-args: VCS_REF=${{ github.event.pull_request.merge_commit_sha }}
      - name: Build migrations
        id: migrations
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: src/backend
          target: migrations
          platforms: linux/amd64
          push: true
          tags: ${{ steps.identity.outputs.prefix }}-migrations:${{ github.event.pull_request.merge_commit_sha }}
          build-args: VCS_REF=${{ github.event.pull_request.merge_commit_sha }}
      - name: Build frontend
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: src/frontend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.identity.outputs.prefix }}-web:${{ github.event.pull_request.merge_commit_sha }}
          build-args: |
            VCS_REF=${{ github.event.pull_request.merge_commit_sha }}
            API_URL=/api/v1
            GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://sophion.io.vn
    permissions:
      contents: read
      packages: read
    env:
      VM_HOST: ${{ vars.VM_HOST }}
      VM_USER: ${{ vars.VM_USER }}
      VM_PORT: ${{ vars.VM_PORT || '22' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Prepare runtime configuration
        env:
          RELEASE_BUNDLE_DIR: ${{ runner.temp }}/fluenta-release
          API_IMAGE: ${{ needs.build.outputs.prefix }}-api@${{ needs.build.outputs.api }}
          MIGRATIONS_IMAGE: ${{ needs.build.outputs.prefix }}-migrations@${{ needs.build.outputs.migrations }}
          WEB_IMAGE: ${{ needs.build.outputs.prefix }}-web@${{ needs.build.outputs.web }}
          POSTGRES_CONNECTION_STRING: ${{ secrets.POSTGRES_CONNECTION_STRING }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          OTP_HASH_KEY: ${{ secrets.OTP_HASH_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          RESEND_FROM: ${{ vars.RESEND_FROM }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          AZURE_SPEECH_ENABLED: ${{ vars.AZURE_SPEECH_ENABLED }}
          AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION }}
        run: python3 deploy/azure/prepare-release.py
      - name: Configure verified SSH access
        env:
          SSH_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ vars.VM_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$VM_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$VM_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$VM_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ -n "$SSH_KEY" && -n "$KNOWN_HOSTS" ]]
          mkdir -m 700 "$RUNNER_TEMP/fluenta-ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/fluenta-ssh/id"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/fluenta-ssh/known_hosts"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/fluenta-ssh/id" >/dev/null
      - name: Transfer private bundle and deploy
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -Eeuo pipefail
          umask 077
          release="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          options=(-i "$RUNNER_TEMP/fluenta-ssh/id" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/fluenta-ssh/known_hosts")
          tar -czf "$RUNNER_TEMP/fluenta-bundle.tgz" -C "$RUNNER_TEMP/fluenta-release" .
          scp "${options[@]}" -P "$VM_PORT" "$RUNNER_TEMP/fluenta-bundle.tgz" "$VM_USER@$VM_HOST:/opt/fluenta/incoming/$release.tgz"
          ssh "${options[@]}" -p "$VM_PORT" "$VM_USER@$VM_HOST" "umask 077; mkdir /opt/fluenta/releases/$release && tar -xzf /opt/fluenta/incoming/$release.tgz -C /opt/fluenta/releases/$release && rm /opt/fluenta/incoming/$release.tgz"
          printf '%s\n' "$REGISTRY_TOKEN" | ssh "${options[@]}" -p "$VM_PORT" "$VM_USER@$VM_HOST" "bash /opt/fluenta/releases/$release/deploy.sh '$REGISTRY_USER'"
      - name: Check public HTTPS and SPA deep link
        run: |
          set -Eeuo pipefail
          for path in /health/ready / /settings/practice; do
            curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
              --retry 8 --retry-delay 5 --retry-all-errors "https://sophion.io.vn$path" > /dev/null
          done
      - name: Remove runner secret files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/fluenta-release" "$RUNNER_TEMP/fluenta-ssh" "$RUNNER_TEMP/fluenta-bundle.tgz"
