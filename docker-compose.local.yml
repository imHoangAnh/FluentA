name: fluenta

services:
  postgres:
    extends:
      file: docker-compose.dev.yml
      service: postgres

  migrations:
    build:
      context: ./src/backend
      target: migrations
    environment:
      FLUENTA_POSTGRES: Host=postgres;Port=5432;Database=fluenta_dev;Username=fluenta;Password=fluenta_dev
    command: ["--connection", "Host=postgres;Port=5432;Database=fluenta_dev;Username=fluenta;Password=fluenta_dev"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./src/backend
      target: final
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: https://+:7000
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=fluenta_dev;Username=fluenta;Password=fluenta_dev
      Kestrel__Certificates__Default__Path: /certs/localhost.pem
      Kestrel__Certificates__Default__KeyPath: /certs/localhost.key
    ports:
      - "127.0.0.1:7000:7000"
    volumes:
      - type: bind
        source: ${FLUENTA_USER_SECRETS_FILE:?Run ./start-local.ps1 first}
        target: /home/app/.microsoft/usersecrets/FluentA-Api-Local-Auth/secrets.json
        read_only: true
        bind:
          create_host_path: false
      - ./src/backend/FluentA.API/appsettings.Development.json:/app/appsettings.Development.json:ro
      - ./.local-docker/certs:/certs:ro
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile.local-runtime
      args:
        FRONTEND_ENV_SHA: ${FLUENTA_FRONTEND_ENV_SHA:-manual}
      secrets:
        - frontend_env
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./.local-docker/certs:/certs:ro
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

secrets:
  frontend_env:
    file: ./src/frontend/.env

volumes:
  fluenta_postgres_dev_data:
    name: fluenta-postgres-dev-data
